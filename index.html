<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16307F">
<meta name="description" content="لعبة خمّن الشخصية: العب مع صاحبك من جوالين أو ضد الكمبيوتر. ٤٨ شخصية بفروقات دقيقة، ووضع خمّن الشي: لاعبين، حيوانات، أكل، ودول.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="لقيتك!">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>لقيتك! — خمّن الشخصية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Lalezar&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --board:#1D3A9E; --board-2:#16307F; --ink:#171433; --sun:#FFC83A;
  --red:#E23D3A; --green:#3E9D5B; --paper:#E9EEFF; --muted:#B9C4F0;
  --display:'Lalezar','Baloo Bhaijaan 2',Tahoma,sans-serif;
  --body:'Baloo Bhaijaan 2',Tahoma,'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  font-family:var(--body); color:#fff; background-color:var(--board);
  background-image:radial-gradient(rgba(255,255,255,.08) 1.4px,transparent 1.6px);
  background-size:18px 18px;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);
  -webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.screen{display:none;min-height:100vh;min-height:100dvh}
.screen.on{display:flex;flex-direction:column}
.wrap{width:100%;max-width:460px;margin:0 auto;padding:18px 18px calc(32px + env(safe-area-inset-bottom,0px))}

.btn{display:block;width:100%;padding:13px 18px;border-radius:14px;border:3px solid var(--ink);background:var(--sun);color:var(--ink);
  font-weight:800;font-size:1.1rem;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.white{background:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.small{font-size:.95rem;padding:9px 12px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-weight:600;padding:8px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.chip{background:rgba(0,0,0,.2);border:2px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:4px 12px;font-weight:800;font-size:.9rem}

.logo{font-family:var(--display);font-weight:400;text-align:center;line-height:1.05;font-size:clamp(4rem,21vw,6rem);color:var(--sun);
  text-shadow:3px 3px 0 var(--ink),-3px 3px 0 var(--ink),0 7px 0 var(--ink)}
html[lang="en"] .logo{font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;letter-spacing:-.02em}
.tag{text-align:center;color:#DCE3FF;font-size:1.02rem;line-height:1.6;margin:8px auto 18px;max-width:34ch}
.hero{display:flex;justify-content:center;gap:10px;margin:0 0 22px;pointer-events:none}
.hero .card{width:76px}
.hero .card:nth-child(1){transform:rotate(-7deg) translateY(6px)}
.hero .card:nth-child(3){transform:rotate(7deg) translateY(6px)}
.field{margin-bottom:14px}
.field label{display:block;font-weight:800;margin-bottom:6px}
.inp{width:100%;padding:13px 16px;border-radius:14px;border:3px solid var(--ink);background:#fff;color:var(--ink);font-size:1.12rem;font-weight:600}
.inp:focus{outline:3px solid var(--sun);outline-offset:2px}
.section{margin-top:18px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);margin:18px 0 12px;font-weight:600}
.or::before,.or::after{content:"";flex:1;height:2px;background:rgba(255,255,255,.18)}
.join{display:flex;gap:10px}
.join .inp{flex:1;text-align:center;letter-spacing:.3em;text-transform:uppercase;direction:ltr}
.join .btn{width:auto;flex:0 0 96px}
.invite{background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:10px 14px;font-weight:700;margin-bottom:16px}
.stack>*+*{margin-top:12px}

.h2{font-family:var(--display);font-weight:400;font-size:2.05rem;line-height:1.2}
html[lang="en"] .h2{font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;font-size:1.75rem}
.code{direction:ltr;text-align:center;font-family:var(--display);font-size:3.3rem;letter-spacing:.18em;background:#fff;color:var(--ink);
  border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:6px 0 0;margin:12px 0 16px}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.status{margin:20px 0;padding:14px;border-radius:14px;background:rgba(0,0,0,.18);font-weight:600;line-height:1.6}
.status b{color:var(--sun)}
.levels{display:grid;gap:8px}
.lvl{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:start;padding:11px 14px;border-radius:14px;border:3px solid var(--ink);
  background:#fff;color:var(--ink);font-weight:800;box-shadow:0 4px 0 var(--ink)}
.lvl small{font-weight:600;color:#5A567A;font-size:.82rem}
.lvl[aria-pressed="true"]{background:var(--sun)}
.lvl:disabled{cursor:default}
.lvl:disabled:not([aria-pressed="true"]){opacity:.55}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--board-2);border-bottom:3px solid var(--ink);padding:10px 12px}
.bar-in{max-width:900px;margin:0 auto}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:999px;border:3px solid var(--ink);font-weight:800;background:#fff;color:var(--ink);font-size:1rem}
.pill.mine{background:var(--sun)}
.pill.theirs{background:var(--red);color:#fff}
.pill.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.tools{display:flex;align-items:center;gap:6px}
.icon-btn{width:38px;height:38px;flex:0 0 auto;border-radius:12px;border:3px solid var(--ink);background:#fff;color:var(--ink);font-size:1.1rem;line-height:1}
.secret{display:flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font-size:.78rem;font-weight:600}
.mini{width:40px;height:48px;border-radius:9px;border:3px solid var(--ink);overflow:hidden;background:var(--paper)}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.timer{display:flex;align-items:center;gap:8px;margin:9px 0 7px}
.track{flex:1;height:12px;border-radius:99px;background:rgba(255,255,255,.16);border:2px solid var(--ink);overflow:hidden}
.track i{display:block;height:100%;width:100%;background:var(--sun);transition:width .2s linear}
.timer.low .track i{background:var(--red)}
.timer b{min-width:2ch;text-align:center;font-weight:800;font-size:1.05rem}
.timer.low b{color:#FF8A86}
.stats{display:flex;justify-content:space-between;gap:6px;font-size:.8rem;color:var(--muted);font-weight:600;margin-top:6px}
.stats b{color:#fff;font-size:.95rem}
.banner{text-align:center;padding:9px 12px;font-weight:700;font-size:.92rem;line-height:1.5;background:rgba(0,0,0,.2)}
.banner.alert{background:var(--red)}
.banner.guess{background:var(--sun);color:var(--ink)}
.log{text-align:center;padding:8px 12px;font-weight:700;font-size:.9rem;background:#fff;color:var(--ink);border-bottom:3px solid var(--ink)}
.log b.y{color:var(--green)} .log b.n{color:var(--red)}
.hintline{text-align:center;padding:6px 12px;font-weight:700;font-size:.86rem;background:#FFF4CF;color:var(--ink);border-bottom:3px solid var(--ink)}
.act{position:sticky;bottom:0;z-index:5;background:var(--board-2);border-top:3px solid var(--ink);padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.act-in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.act-in .btn{flex:1;padding:12px 6px;font-size:.98rem;white-space:nowrap}
.act-in .btn,#mineAct .btn{min-width:0;overflow:hidden;text-overflow:ellipsis}
#mineAct,#pickAct{min-width:0}
@media (max-width:400px){
  .secret>span:first-child{display:none}
  .act-in,#mineAct{gap:6px!important}
  .act-in .btn{font-size:.9rem;padding:12px 4px}
  .act-in .btn.hint{padding:12px 10px}
}
.act-in .btn.hint{flex:0 0 auto;width:auto;padding:12px 14px}
.wait{flex:1;text-align:center;font-weight:700;color:#DCE3FF;padding:8px 4px;line-height:1.5}
.pick-head{padding:16px 16px 4px;max-width:900px;margin:0 auto;width:100%}
.pick-head p{color:#DCE3FF;margin-top:4px;line-height:1.5}

.board{flex:1;padding:12px;width:100%;max-width:900px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (min-width:560px){.grid{grid-template-columns:repeat(6,1fr);gap:10px}}
@media (min-width:900px){.grid{grid-template-columns:repeat(8,1fr)}}
.grid.dim .card:not(.sel){opacity:.35}
.card{display:block;border:0;background:none;padding:0;perspective:600px;aspect-ratio:3/4;width:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.card.off{display:none}
.card .in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.card.down .in{transform:rotateX(180deg)}
.face,.back{position:absolute;inset:0;border-radius:12px;border:3px solid var(--ink);overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column}
.face{background:#fff;box-shadow:0 3px 0 var(--ink)}
.face img{flex:1;min-height:0;width:100%;object-fit:cover;display:block;background:var(--paper);-webkit-user-drag:none;pointer-events:none}
.nm{display:block;background:var(--sun);color:var(--ink);border-top:3px solid var(--ink);font-weight:800;font-size:.8rem;text-align:center;padding:1px 2px 0;white-space:nowrap;overflow:hidden}
.back{transform:rotateX(180deg);background-color:var(--red);align-items:center;justify-content:center;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 6px,transparent 6px 12px)}
.back span{font-family:var(--display);font-size:2rem;color:rgba(255,255,255,.55)}
.card.sel .face{outline:4px solid var(--sun);outline-offset:2px}
.card.sel .in{transform:scale(1.05)}
.card.down.sel .in{transform:rotateX(180deg)}

.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(9,14,44,.74)}
.modal.on{display:flex}
.sheet{width:100%;max-width:420px;max-height:88vh;overflow:auto;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 var(--ink);padding:20px}
.sheet .h2{margin-bottom:8px}
.sheet p{line-height:1.65;margin-bottom:12px}
.sheet .btn{margin-top:10px}
.rules li{margin:0 20px 9px 0;line-height:1.6}
html[dir="ltr"] .rules li{margin:0 0 9px 20px}
.zoom-face{width:min(64vw,240px);aspect-ratio:5/6;margin:4px auto 10px;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--paper)}
.zoom-face img{width:100%;height:100%;object-fit:cover;display:block}
.center{text-align:center}
.duo{display:flex;justify-content:center;gap:18px;margin:12px 0 4px}
.duo figure{width:96px;text-align:center;font-size:.85rem;font-weight:700}
.duo .card{margin-bottom:6px}
.qgroup{margin-bottom:12px}
.qgroup h3{font-size:.85rem;color:#5A567A;margin-bottom:6px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.q{position:relative;text-align:start;padding:9px 10px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;color:var(--ink);font-weight:700;font-size:.88rem;line-height:1.35}
.q:disabled{background:#EEF0F8;cursor:default}
.q .ans{float:inline-end;font-weight:800;margin-inline-start:4px}
.q .ans.y{color:var(--green)} .q .ans.n{color:var(--red)}
.big-ans{font-family:var(--display);font-size:3rem;line-height:1.1;margin:6px 0}
.big-ans.y{color:var(--green)} .big-ans.n{color:var(--red)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:12px;font-weight:700;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.topline .chip:last-child{margin-inline-start:auto}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
.stat{border:2.5px solid var(--ink);border-radius:14px;padding:8px 4px;text-align:center;background:var(--paper)}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;line-height:1.1}
html[lang="en"] .stat b{font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800}
.stat span{font-size:.75rem;font-weight:700;color:#5A567A}
.stat.hot{background:var(--sun)}
.modes{width:100%;border-collapse:collapse;margin-bottom:6px;font-size:.92rem}
.modes td{padding:7px 4px;border-bottom:2px dashed #D5DAF0}
.modes td:last-child{text-align:end;font-weight:800}
.empty{color:#5A567A;text-align:center;padding:10px 0 16px}
.streak{font-weight:800;background:#FFF4CF;border:2.5px solid var(--ink);border-radius:12px;padding:6px 10px;display:inline-block}
.emo-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:40;
  display:flex;gap:2px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:5px 8px;box-shadow:0 5px 0 var(--ink);max-width:calc(100vw - 20px)}
.emo-bar button{border:0;background:none;font-size:1.65rem;width:42px;height:44px;border-radius:12px;line-height:1}
.emo-bar button:active{background:var(--paper);transform:scale(.9)}
.emo-fly{position:fixed;z-index:65;pointer-events:none;text-align:center;animation:emofly 2.4s ease-out forwards}
.emo-fly .e{display:block;font-size:68px;line-height:1;filter:drop-shadow(0 4px 0 rgba(23,20,51,.35))}
.emo-fly .who{display:inline-block;margin-top:4px;background:var(--ink);color:#fff;font-weight:800;font-size:.78rem;border-radius:999px;padding:1px 10px}
.emo-fly.opp{top:calc(150px + env(safe-area-inset-top,0px));inset-inline-start:18px}
.emo-fly.me{bottom:calc(150px + env(safe-area-inset-bottom,0px));inset-inline-end:22px}
.emo-fly.me .e{font-size:52px}
@keyframes emofly{0%{transform:scale(.3) translateY(24px);opacity:0}14%{transform:scale(1.25);opacity:1}28%{transform:scale(1)}78%{opacity:1;transform:translateY(-10px)}100%{opacity:0;transform:translateY(-70px)}}
.icon-btn.live{background:var(--green);color:#fff}
.icon-btn.muted{background:var(--red);color:#fff;text-decoration:line-through}
.icon-btn.off{opacity:.55}
.voiceline{text-align:center;padding:6px 12px;font-weight:700;font-size:.86rem;background:#DFF5E6;color:var(--ink);border-bottom:3px solid var(--ink)}
.voice-lobby{margin:-6px 0 8px}
.voice-note{font-size:.88rem;color:#DCE3FF;margin:0 0 16px;line-height:1.5}
.custom{margin-top:14px;background:rgba(0,0,0,.16);border-radius:14px;padding:12px}
.sheet .custom{background:var(--paper);border:2.5px solid var(--ink)}
.clabel{font-weight:800;font-size:.92rem;margin:0 0 6px}
.clabel+.chips{margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-width:46px;padding:7px 10px;border-radius:10px;border:2.5px solid var(--ink);background:#fff;color:var(--ink);font-weight:800;font-size:.92rem}
.chips button[aria-pressed="true"]{background:var(--sun);box-shadow:0 3px 0 var(--ink)}
.chips button:disabled{cursor:default}
.chips button:disabled:not([aria-pressed="true"]){opacity:.5}
.cnote{font-size:.8rem;line-height:1.5;margin:2px 0 0;opacity:.8}
.sheet .levels .lvl{box-shadow:0 3px 0 var(--ink)}
.splash{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(9,14,44,.6)}
.splash[hidden]{display:none}
.splash-card{width:100%;max-width:340px;background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:24px;box-shadow:0 10px 0 var(--ink);
  overflow:hidden;text-align:center;animation:splashIn .45s cubic-bezier(.3,1.5,.5,1)}
.splash-top{padding:8px 12px;font-weight:800;color:#fff;background:var(--ink)}
.splash-q{font-weight:800;font-size:1.3rem;line-height:1.4;padding:14px 16px 0;margin:0}
.splash-a{font-family:var(--display);font-size:4.6rem;line-height:1.15;padding:6px 0 0}
html[lang="en"] .splash-a{font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800}
.splash-note{font-weight:700;font-size:.9rem;padding:0 16px 16px;margin:0;color:#5A567A}
.splash.y .splash-card{background:#E4F7EA} .splash.y .splash-a{color:var(--green)} .splash.y .splash-top{background:var(--green)}
.splash.n .splash-card{background:#FDE7E6} .splash.n .splash-a{color:var(--red)} .splash.n .splash-top{background:var(--red)}
@keyframes splashIn{0%{transform:scale(.4) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
.log.y{background:#E4F7EA} .log.n{background:#FDE7E6}
.log.flash{animation:logflash .9s ease-out}
@keyframes logflash{0%{transform:scaleY(1.35);filter:brightness(1.15)}100%{transform:none}}
/* ---- football mode ---- */
.gt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 18px}
.gt button{padding:10px 8px;border-radius:14px;border:3px solid var(--ink);background:rgba(255,255,255,.12);color:#fff;font-weight:800;font-size:1rem;line-height:1.3}
.gt button small{display:block;font-weight:600;font-size:.78rem;opacity:.85}
.gt button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.gt button[data-gt="foot"][aria-pressed="true"]{background:var(--green);color:#fff}
.gt button:disabled{cursor:default}
.gt button:disabled:not([aria-pressed="true"]){opacity:.5}
.st{position:relative;border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);overflow:hidden;color:#fff;text-align:center;
  background:repeating-linear-gradient(90deg,#2E8A4C 0 28px,#35995A 28px 56px);padding:12px 12px 14px}
.st::before{content:"";position:absolute;left:50%;top:50%;width:118px;height:118px;margin:-59px 0 0 -59px;border:2px solid rgba(255,255,255,.3);border-radius:50%;pointer-events:none}
.st::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.3);pointer-events:none}
.st>*{position:relative;z-index:1}
.st-top{display:flex;justify-content:space-between;align-items:flex-start}
.st-flag{font-size:3.4rem;line-height:1;filter:drop-shadow(0 3px 0 rgba(23,20,51,.4))}
.st-pos{background:var(--sun);color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:800;font-size:.85rem}
.st-name{font-family:var(--display);font-size:2.2rem;line-height:1.15;margin:14px 0 4px;color:#fff;text-shadow:2px 2px 0 var(--ink),-2px 2px 0 var(--ink),0 4px 0 var(--ink);overflow-wrap:anywhere}
html[lang="en"] .st-name{font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;font-size:1.8rem}
.st-meta{font-weight:700;font-size:.92rem;color:#E7F6EC}
.st-clubs{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:12px}
.st-clubs span{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:1px 7px;font-weight:700;font-size:.78rem}
.st.mid .st-flag{font-size:2.6rem} .st.mid .st-name{font-size:1.75rem;margin-top:6px}

#footBoard{max-width:560px}

.duo.foot .st{margin-bottom:6px}

.splash.m .splash-card{background:#FFF4CF} .splash.m .splash-a{color:#8A6D00} .splash.m .splash-top{background:#8A6D00}

function tone(f, d = .12, type = 'sine', v = .15, when = 0, to){
  if (!SND.on) return; const c = audio(); if (!c) return;
  const s = c.currentTime + when, o = c.createOscillator(), g = c.createGain();

}

  $('#botBtn').hidden = gt === 'foot'; $('#botNote').hidden = gt !== 'foot'; $('#botNote').textContent = t('botFootNote');
  const host = role === 'host' && !!S && S.phase === 'lobby' && S.mode === 'online';
  $('#gtLobby').innerHTML = btns(S ? S.gt : gt);
  $('#gtLobby').querySelectorAll('button').forEach(b => b.disabled = !host);
  const showCats = !!S && S.gt === 'foot';
  $('#catLabel').hidden = !showCats; $('#catPick').hidden = !showCats;
  if (showCats) $('#catPick').innerHTML = Object.entries(CATS).map(([k, C]) =>
    `<button type="button" data-cat="${k}" aria-pressed="${k === S.cat}" ${host ? '' : 'disabled'}><span class="ce">${C[2]}</span>${esc(C[L2()])}</button>`).join('');
}
let dealShown = null, seenFq = '';
function renderFootPick(){
  const pool = fPool();
  if (mySecret == null && (selected == null || !pool.includes(selected))) selected = pool[Math.floor(Math.random()*pool.length)];
  const cur = mySecret != null ? mySecret : selected;
  if (cur !== dealShown) { const box = $('#footDeal'); box.innerHTML = flipHTML(sticker(cur, 'big')); dealShown = cur; openFlip(box); setTimeout(sfx.flip, 200); }
  const locked = mySecret != null;
  $('#lockBtn').disabled = selected == null;
  $('#pickAct').hidden = locked; $('#pickWait').hidden = !locked;
  $('#pickWait').textContent = t('waitPick', {name:oppName()});
}
function renderFootGame(){
  const play = S.phase === 'play', mine = play && S.turn === role;
  const me = S.p[role], op = S.p[other(role)];
  if (play && S.turn !== lastTurn) {
    if (mine) { sfx.turn(); buzz(lastTurn === null ? 60 : [60,40,60]); if (lastTurn !== null) toast(t('yourTurnToast')); }
    lastTurn = S.turn; const pl = $('#turnPill'); pl.classList.remove('pop'); void pl.offsetWidth; pl.classList.add('pop');
  }
  guessMode = false;
  const must = mine && me.q <= 0;
  $('#gameGrid').parentElement.hidden = true; $('#footBoard').hidden = false;
  $('#myLeft').parentElement.hidden = true; $('#oppLeft').parentElement.hidden = true;
  const pill = $('#turnPill');
  pill.classList.toggle('mine', mine); pill.classList.toggle('theirs', play && !mine);
  pill.textContent = !play ? t('roundOver') : mine ? ((me.av ? me.av + ' ' : '') + t('yourTurn')) : t('theirTurn', {name:(op.av ? op.av + ' ' : '') + op.name});
  $('#mini').innerHTML = mySecret != null ? `<span class="mini-flag" style="background:${CATS[IT[mySecret].c][3]}">${itemIcon(mySecret)}</span>` : '';
  $('#soundBtn').textContent = SND.on ? '🔊' : '🔇';
  $('#myQ').textContent = `${me.q}/${S.settings.q}`;
  $('#oppQ').textContent = `${op.q}/${S.settings.q}`;
  $('#timer').hidden = !play || !S.settings.t;

  const lg = $('#logLine');
  if (S.log) {
    const L = S.log, q = L.q || t('fVoiceQ'), a = ansLbl(L.a);
    lg.innerHTML = L.by === role ? t('youAsked', {q:esc(q), a, c:L.a}) : t('oppAsked', {name:esc(op.name), q:esc(q), a, c:L.a});
    lg.hidden = false; lg.classList.remove('y', 'n', 'm'); lg.classList.add(L.a);
    if (L.n !== seenLog) {
      seenLog = L.n;
      if (L.by === role) { showSplash(t('splashMe'), q, L.a, '', 2600); setTimeout(() => (L.a === 'y' ? sfx.yes : sfx.no)(), 0); buzz(L.a === 'y' ? [30,40,30] : 140); }
      else toast(t('fAnswered'));
      lg.classList.remove('flash'); void lg.offsetWidth; lg.classList.add('flash');
    }
  } else lg.hidden = true;

  const hl = $('#hintLine');
  if (S.hint && S.hint.n !== seenHint) {
    seenHint = S.hint.n;
    if (S.hint.by === role) sfx.hint(); else toast(t('hintOpp', {name:op.name}));
  }
  if (S.hint && S.hint.by === role) { hl.textContent = t('fHintLine', {q:hintText(S.hint.qid)}); hl.hidden = false; } else hl.hidden = true;

  const theirQ = play && !mine && S.fq && S.fq.by !== role ? S.fq.text : '';
  if (theirQ) { const key = S.turn + (S.log ? S.log.n : 0) + theirQ; if (key !== seenFq) { seenFq = key; sfx.ask(); buzz([40,30,40]); } }
  const b = $('#banner'); b.className = 'banner';
  if (!play) b.textContent = t('roundOver');
  else if (must) { b.textContent = t('fMust'); b.classList.add('alert'); }
  else if (mine) b.textContent = S.fq && S.fq.by === role ? t('fWaitAns', {name:op.name}) : t('fMine', {name:op.name});
  else if (op.q <= 0) b.textContent = t('fTheirsMust', {name:op.name});
  else if (theirQ) { b.textContent = t('fTheirsQ', {name:op.name, q:theirQ}); b.classList.add('guess'); }
  else b.textContent = t('fTheirs', {name:op.name});

  const showAns = play && !mine && op.q > 0;
  $('#mineAct').hidden = !mine; $('#ansAct').hidden = !showAns; $('#waitAct').hidden = mine || showAns;
  $('#waitAct').textContent = play ? t('waitTurn', {name:op.name}) : '';
  $('#endBtn').hidden = true; $('#doneBtn').hidden = true;
  $('#hintBtn').hidden = must; $('#hintBtn').disabled = me.hint || me.q < 2;
  $('#guessBtn').textContent = t('fGuessBtn'); $('#guessBtn').disabled = false;

  $('#fMine').innerHTML = mySecret != null ? `<p class="fmine-label">${esc(t('fMineLabel', {name:op.name}))}</p>${sticker(mySecret, 'mid')}` : '';
  $('#fAsk').hidden = !mine || must || !!(S.fq && S.fq.by === role);
  const C = CATS[S.cat] || CATS.mix; $('#fAskInp').placeholder = t('fAskPh', {q:C[4 + L2()]});
  const qb = $('#fQuick'); qb.hidden = $('#fAsk').hidden;
  if (!qb.hidden) {
    const used = new Set((S.hist || []).filter(h => h.by === role).map(h => h.q));
    const list = (QQ[S.cat] || QQ.mix).map(p => p[L2()]).filter(q => !used.has(q));
    const key = S.cat + lang + list.join('|');
    if (qb.dataset.key !== key) { qb.dataset.key = key; qb.innerHTML = list.map(q => `<button type="button" data-qq="${esc(q)}">${esc(q)}</button>`).join(''); qb.scrollLeft = 0; }
  }
  const H = S.hist || [];
  $('#fHistT').textContent = t('fHist', {n:H.length});
  $('#fHist').innerHTML = H.length ? H.slice().reverse().map(h => {
    const m = h.by === role;
    return `<li class="${m ? 'me' : 'op'}"><span class="who">${esc(m ? (me.av || '') + ' ' + t('fYou') : (op.av || '') + ' ' + op.name)}</span><span class="q">${esc(h.q || t('fVoiceQ'))}</span><b class="${h.a}">${esc(ansLbl(h.a))}</b></li>`;
  }).join('') : `<li class="none">${esc(t('fHistEmpty'))}</li>`;
}
function openFootGuess(){
  if (!S || S.phase !== 'play' || S.turn !== role) return;
  $('#fSearch').value = ''; renderFootResults(); openM('fGuessM');
  setTimeout(() => $('#fSearch').focus(), 60);
}
function renderFootResults(){
  const q = normName($('#fSearch').value), box = $('#fRes');
  if (q.replace(/\s/g, '').length < 2) { box.innerHTML = `<p class="empty">${esc(t('fTypeName'))}</p>`; return; }
  const words = q.split(' ');
  const hits = fPool().filter(i => words.every(w => ITN[i].includes(w))).slice(0, 8);
  box.innerHTML = hits.length ? hits.map(i => `<button type="button" data-pl="${i}"><span class="fl">${itemIcon(i)}</span><span>${esc(IT[i].n[L2()])}<small>${esc(IT[i].n[1 - L2()])}</small></span></button>`).join('')
    : `<p class="empty">${esc(t('fNoRes'))}</p>`;
}
function pickFootGuess(id){
  closeM('fGuessM'); guessTarget = id;
  const cf = $('#confirmFace'); cf.classList.add('st-wrap'); cf.innerHTML = sticker(id, 'mid');
  $('#confirmTitle').textContent = t('fConfirmTitle', {name:nm(id)});
  openM('confirmM');
}
function sendFootQ(){
  const inp = $('#fAskInp'), v = inp.value.trim();
  if (!v || !S || !isFoot()) return;
  act('fq', {q:v}); inp.value = ''; inp.blur();
}

/* ---------- language ---------- */
function updateInvite(){
  const room = new URLSearchParams(location.search).get('room');
  if (room && !S) { $('#invite').hidden = false; $('#invite').textContent = t('invite', {code:room.toUpperCase()}); }
}
function applyLang(){
  const h = document.documentElement; h.lang = lang; h.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = t('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  $('#langBtn').textContent = lang === 'ar' ? 'English' : 'العربية';
  $('#rulesList').innerHTML = t('rules').split('|').map(r => `<li>${esc(r)}</li>`).join('')
    + `<li class="rules-h">${esc(t('fRulesTitle'))}</li>` + t('fRules').split('|').map(r => `<li>${esc(r)}</li>`).join('');
  document.querySelectorAll('.card[data-id]').forEach(el => {
    const id = +el.dataset.id, n = el.querySelector('.nm'); if (n) n.textContent = dn(id); el.setAttribute('aria-label', dn(id));
  });
  renderLevels(); renderGt(); updateInvite(); dealShown = null;
  if (S) render();
}

/* ---------- PWA ---------- */
let deferredPrompt = null;
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; $('#installBtn').hidden = false; });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------- init ---------- */
function init(){
  const hero = $('#hero');
  [0, 9, 17].forEach((id, i) => { const el = makeCard(id); el.tabIndex = -1; if (i === 2) el.classList.add('down'); hero.appendChild(el); });
  for (let id = 0; id < DECK.length; id++) { $('#pickGrid').appendChild(makeCard(id)); $('#gameGrid').appendChild(makeCard(id)); }

  bindGrid($('#pickGrid'), id => { if (mySecret != null) return; selected = id; sfx.pick(); renderPick(); });
  bindGrid($('#gameGrid'), id => {
    if (!S) return;
    if (S.phase === 'play' && guessMode && S.turn === role) {
      guessTarget = id; renderGame();
      $('#confirmFace').classList.remove('st-wrap'); $('#confirmFace').innerHTML = faceImg(id);
      $('#confirmTitle').textContent = t('confirmTitle', {name:nm(id)});
      openM('confirmM'); return;
    }
    if (down.has(id)) down.delete(id); else down.add(id);
    sfx.flip(); renderGame();
    if (S.phase === 'play') act('left', {n:N() - down.size});
  });

  try { const n = localStorage.getItem('laqeetak-name'); if (n) $('#name').value = n; } catch(e){}
  const room = new URLSearchParams(location.search).get('room');
  if (room) $('#joinCode').value = room.toUpperCase().slice(0, 5);
  if (isIOS && !standalone()) $('#installBtn').hidden = false;

  $('#langBtn').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('lq-lang', lang); } catch(e){} applyLang(); };
  $('#installBtn').onclick = async () => {
    if (deferredPrompt) { deferredPrompt.prompt(); try { await deferredPrompt.userChoice; } catch(e){} deferredPrompt = null; $('#installBtn').hidden = true; }
    else openM('iosM');
  };
  $('#createBtn').onclick = () => createRoom(false);
  $('#botBtn').onclick = () => { renderLevels(); openM('botM'); };
  $('#joinBtn').onclick = joinRoom;
  $('#joinCode').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });
  $('#shareBtn').onclick = async () => {
    const url = inviteLink();
    try { if (navigator.share) { await navigator.share({title:t('title'), text:t('shareText', {code:roomCode}), url}); return; } }
    catch(e){ if (e.name === 'AbortError') return; }
    await copy(url); toast(t('linkCopied'));
  };
  $('#copyCodeBtn').onclick = async () => { await copy(roomCode); toast(t('codeCopied')); };
  document.addEventListener('click', e => {
    const lv = e.target.closest('.lvl'); if (!lv || lv.disabled) return;
    if (lv.closest('#botLevels')) { botSetup = {level:lv.dataset.lvl, ...LEVELS[lv.dataset.lvl]}; renderLevels(); }
    else if (role === 'host' && S && S.phase === 'lobby') { setLevel(lv.dataset.lvl); broadcast(); }
  });
  document.addEventListener('click', e => {
    const b = e.target.closest('.chips button'); if (!b || b.disabled) return;
    const v = +b.dataset.v, k = b.dataset.k;
    if (b.closest('#botQ, #botT')) { botSetup[k] = v; renderLevels(); return; }
    if (role === 'host' && S && S.phase === 'lobby') {
      S.settings[k] = v;
      if (k === 'q') { S.p.host.q = v; S.p.guest.q = v; }
      broadcast();
    }
  });
  $('#botStartBtn').onclick = () => startBot();
  $('#startBtn').onclick = () => { if (role === 'host' && S) { startPick(); broadcast(); } };

  $('#randBtn').onclick = () => {
    if (mySecret != null) return;
    if (isFoot()) { const pool = fPool().filter(i => i !== selected); selected = pool[Math.floor(Math.random()*pool.length)]; sfx.flip(); renderPick(); return; } selected = Math.floor(Math.random()*N()); sfx.pick(); renderPick();
    const el = $(`#pickGrid .card[data-id="${selected}"]`); el && el.scrollIntoView({block:'center', behavior:'smooth'});
  };
  $('#lockBtn').onclick = () => { if (selected == null) return; mySecret = selected; renderPick(); act('ready'); };

  $('#endBtn').onclick = () => { guessMode = false; if (S) openAsk(); };
  $('#doneBtn').onclick = () => { guessMode = false; act('end'); };
  $('#micBtn').onclick = micToggle; $('#micLobbyBtn').onclick = micToggle;
  $('#spkBtn').onclick = spkToggle; $('#spkLobbyBtn').onclick = spkToggle;
  $('#askList').addEventListener('click', e => { const b = e.target.closest('.q'); if (!b || b.disabled) return; closeM('askM'); act('ask', {qid:b.dataset.q}); });
  $('#hintBtn').onclick = () => {
    const me = S && S.p[role]; if (!me) return;
    if (me.hint || me.q < 2) { toast(t('hintNo')); return; }
    if (confirm(t(isFoot() ? 'fHintCost' : 'hintCost'))) act('hint');
  };
  $('#guessBtn').onclick = () => { if (isFoot()) { openFootGuess(); return; } guessMode = !guessMode; guessTarget = null; renderGame(); };
  $('#confirmYes').onclick = () => { if (guessTarget == null) return; closeM('confirmM'); act('guess', {id:guessTarget}); toast(t('checking')); };
  $('#secretBtn').onclick = () => { if (mySecret == null) return; if (isFoot()) showFootCard(mySecret); else zoom(mySecret); };
  document.addEventListener('click', e => {
    const b = e.target.closest('.gt button'); if (!b || b.disabled) return;
    const v = b.dataset.gt === 'foot' ? 'foot' : 'faces';
    if (b.closest('#gtHome')) { gt = v; try { localStorage.setItem('lq-gt', gt); } catch(e){} renderGt(); return; }
    if (role === 'host' && S && S.phase === 'lobby' && S.mode === 'online' && S.gt !== v) {
      gt = v; try { localStorage.setItem('lq-gt', gt); } catch(e){}
      S.gt = v; setLevel(S.level); broadcast();
    }
  });
  $('#catPick').addEventListener('click', e => {
    const b = e.target.closest('[data-cat]'); if (!b || b.disabled || !CATS[b.dataset.cat]) return;
    if (role === 'host' && S && S.phase === 'lobby' && S.gt === 'foot') { S.cat = gcat = b.dataset.cat; try { localStorage.setItem('lq-cat', gcat); } catch(e){} broadcast(); }
  });
  $('#ansAct').addEventListener('click', e => { const b = e.target.closest('[data-ans]'); if (b) { buzz(20); act('fans', {v:b.dataset.ans}); } });
  $('#fAskBtn').onclick = sendFootQ;
  $('#fAskInp').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendFootQ(); } });
  $('#fSearch').addEventListener('input', renderFootResults);
  $('#fRes').addEventListener('click', e => { const b = e.target.closest('[data-pl]'); if (b) pickFootGuess(+b.dataset.pl); });
  $('#soundBtn').onclick = () => { SND.on = !SND.on; try { localStorage.setItem('lq-sound', SND.on ? '1' : '0'); } catch(e){} if (SND.on) audio(); renderGame(); };

  $('#againBtn').onclick = () => act('rematch');
  $('#viewBoardBtn').onclick = () => { overHidden = true; closeM('overM'); };
  $('#turnPill').onclick = () => { if (S && S.phase === 'over') { overHidden = false; render(); } };
  $('#retryBtn').onclick = retry;
  $('#splash').onclick = () => { clearTimeout(splashT); $('#splash').hidden = true; };
  $('#statsBtn').onclick = openStats;
  $('#statsReset').onclick = () => { if (confirm(t('statsResetQ'))) { try { localStorage.removeItem('lq-stats'); } catch(e){} openStats(); } };
  $('#emoBar').innerHTML = EMOS.map(e => `<button type="button" data-emo="${e}" aria-label="${e}">${e}</button>`).join('');
  $('#emoBtn').onclick = e => { e.stopPropagation(); $('#emoBar').hidden = !$('#emoBar').hidden; };
  $('#emoBar').addEventListener('click', e => { const b = e.target.closest('[data-emo]'); if (b) sendEmo(b.dataset.emo); });
  document.addEventListener('pointerdown', e => { if (!e.target.closest('#emoBar') && !e.target.closest('#emoBtn')) $('#emoBar').hidden = true; });

  document.addEventListener('click', e => {
    const o = e.target.closest('[data-open]'); if (o) openM(o.dataset.open);
    const c = e.target.closest('[data-close]'); if (c) c.closest('.modal').classList.remove('on');
    if (e.target.closest('[data-home]')) goHome();
    if (e.target.classList.contains('modal') && ['rulesM','zoomM','confirmM','askM','ansM','botM','iosM','statsM','fGuessM'].includes(e.target.id)) e.target.classList.remove('on');
  });

  setInterval(() => {
    if (role === 'host') hostTick();
    if (S && S.phase === 'play' && S.settings.t) {
      const rem = Math.max(0, deadline - Date.now()), sec = Math.ceil(rem / 1000);
      $('#timerBar').style.width = Math.min(100, rem / (S.settings.t*1000) * 100) + '%';
      $('#timerNum').textContent = Math.min(sec, S.settings.t);
      $('#timer').classList.toggle('low', rem < 10000);
      if (S.turn === role && sec <= 5 && sec > 0 && sec !== lastTickSec) { lastTickSec = sec; sfx.tick(); }
    }
  }, 200);

  const renderAvs = () => { $('#avs').innerHTML = AVS.map(a => `<button type="button" data-av="${a}" aria-pressed="${a === myAv}">${a}</button>`).join(''); };
  renderAvs();
  $('#avs').addEventListener('click', e => { const b = e.target.closest('[data-av]'); if (!b) return; myAv = avOk(b.dataset.av); try { localStorage.setItem('lq-av', myAv); } catch(e){} sfx.pick(); renderAvs(); });
  $('#fQuick').addEventListener('click', e => { const b = e.target.closest('[data-qq]'); if (b && S && isFoot()) act('fq', {q:b.dataset.qq}); });
  setTimeout(() => FACES.forEach(src => { const im = new Image(); im.src = src; }), 1200);
  applyLang();
}
init();

})();
